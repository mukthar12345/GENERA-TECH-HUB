<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Page Not Found - Genera Tech Hub</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0A1628">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
     <!-- 👇 ADD THIS LINE RIGHT HERE 👇 -->
    <link rel="icon" type="image/x-icon" href="/public/images/favicon.ico">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../public/css/style.css">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 1rem 4rem;
            background: var(--gradient-hero);
            position: relative;
            overflow: hidden;
        }
        
        .error-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .error-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
        }
        
        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 900;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }
        
        .error-content h1 {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            margin-bottom: 1rem;
            color: var(--white);
        }
        
        .error-content p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .error-content .icon-big {
            font-size: 5rem;
            margin-bottom: 1rem;
        }
        
        .error-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        
        .error-buttons .btn {
            padding: 0.9rem 1.8rem;
        }
        
        .help-links {
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .help-links p {
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        
        .help-links .links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .help-links .links a {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition-fast);
        }
        
        .help-links .links a:hover {
            text-decoration: underline;
        }
        
        .trust-tag {
            margin-top: 2.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gold);
            font-family: var(--font-heading);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }
    </style>
</head>
<body id="main-content">
    <div id="header-placeholder"></div>
    
    <section class="error-page">
        <div class="error-content">
            <div class="icon-big">🔍</div>
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p>
                Sorry, the page you're looking for doesn't exist or has been moved. 
                Let's get you back on track.
            </p>
            
            <div class="error-buttons">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> Go Home
                </a>
                <a href="product.html" class="btn btn-secondary">
                    <i class="fas fa-shopping-bag"></i> Browse Products
                </a>
                <a href="https://wa.me/2348081302228" target="_blank" class="btn btn-whatsapp">
                    <i class="fab fa-whatsapp"></i> Get Help
                </a>
            </div>
            
            <div class="help-links">
                <p>Popular pages you might be looking for:</p>
                <div class="links">
                    <a href="repair.html">🔧 Repair Services</a>
                    <a href="swap.html">🔄 Trade-in</a>
                    <a href="reviews.html">⭐ Reviews</a>
                    <a href="contact.html">📞 Contact</a>
                    <a href="about.html">🏢 About Us</a>
                </div>
            </div>
            
            <div class="trust-tag">
                <i class="fas fa-crown"></i>
                Genera Tech Hub — Technology You Can Trust
            </div>
        </div>
    </section>
    
    <script>
        fetch('../components/header.html')
            .then(r => r.text())
            .then(d => {
                document.getElementById('header-placeholder').innerHTML = d;
            })
            .catch(err => {
                console.warn('Header not loaded:', err);
            });
    </script>
</body>
</html>
