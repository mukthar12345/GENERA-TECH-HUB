<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Product Details - Genera Tech Hub</title>
    <meta name="description" content="View full details, specifications, and pricing for this product at Genera Tech Hub.">
    <meta name="theme-color" content="#0A1628">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <!-- 👇 ADD THIS LINE RIGHT HERE 👇 -->
    <link rel="icon" type="image/x-icon" href="/public/images/favicon.ico">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../public/css/style.css">
    
    <style>
        .product-detail-page {
            padding-top: 100px;
            padding-bottom: 4rem;
            min-height: 100vh;
        }
        
        .product-detail-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            padding: 2rem 0;
        }
        
        .product-gallery {
            position: sticky;
            top: 100px;
            height: fit-content;
        }
        
        .product-gallery .main-image {
            width: 100%;
            height: 500px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: rgba(26, 45, 74, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.05);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-gallery .main-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .product-gallery .main-image:hover img {
            transform: scale(1.05);
        }
        
        .product-gallery .main-image .badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }
        
        .badge-featured { background: var(--gradient-gold); color: var(--navy-dark); }
        .badge-new { background: rgba(0, 230, 118, 0.9); color: var(--navy-dark); }
        .badge-refurbished { background: rgba(0, 188, 212, 0.9); color: var(--white); }
        .badge-used { background: rgba(255, 193, 7, 0.9); color: var(--navy-dark); }
        
        .product-gallery .thumbnails {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        
        .product-gallery .thumbnail {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: var(--transition-fast);
            background: rgba(26, 45, 74, 0.4);
        }
        
        .product-gallery .thumbnail:hover { border-color: var(--gold-soft); }
        .product-gallery .thumbnail.active {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        
        .product-gallery .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .product-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .product-info .breadcrumb {
            color: var(--text-muted);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .product-info .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition-fast);
        }
        
        .product-info .breadcrumb a:hover { color: var(--gold); }
        .product-info .breadcrumb .current { color: var(--gold); }
        
        .product-info h1 {
            font-size: clamp(1.5rem, 3vw, 2rem);
            line-height: 1.3;
            margin: 0;
        }
        
        .product-info .rating-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .product-info .stars {
            color: var(--gold);
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        
        .product-info .rating-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .product-info .category-tag {
            display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold);
            padding: 0.3rem 0.9rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: fit-content;
        }
        
        .product-info .price-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 1.25rem;
            background: rgba(26, 45, 74, 0.4);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        
        .product-info .current-price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
            font-family: var(--font-heading);
            line-height: 1;
        }
        
        .product-info .price-note {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        
        .product-info .stock-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }
        
        .product-info .stock-row .stock-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        
        .product-info .stock-row.in-stock {
            background: rgba(0, 230, 118, 0.08);
            border-color: rgba(0, 230, 118, 0.2);
            color: #00E676;
        }
        
        .product-info .stock-row.in-stock .stock-dot {
            background: #00E676;
            box-shadow: 0 0 10px #00E676;
        }
        
        .product-info .stock-row.out-of-stock {
            background: rgba(255, 23, 68, 0.08);
            border-color: rgba(255, 23, 68, 0.2);
            color: #FF1744;
        }
        
        .product-info .stock-row.out-of-stock .stock-dot {
            background: #FF1744;
        }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .product-info .description {
            color: var(--text-light);
            line-height: 1.8;
            font-size: 0.95rem;
        }
        
        .product-info .specs-section {
            background: rgba(26, 45, 74, 0.4);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            border: 1px solid rgba(255, 215, 0, 0.05);
        }
        
        .product-info .specs-section h3 {
            color: var(--gold);
            margin-bottom: 1rem;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .product-info .specs-table {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        
        .product-info .spec-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .product-info .spec-item .spec-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .product-info .spec-item .spec-value {
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .product-info .quantity-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .product-info .quantity-row label {
            color: var(--text-light);
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .product-info .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        
        .product-info .qty-control button {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: none;
            color: var(--text-light);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-fast);
        }
        
        .product-info .qty-control button:hover {
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold);
        }
        
        .product-info .qty-control input {
            width: 60px;
            height: 40px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--white);
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
        }
        
        .product-info .qty-control input:focus { outline: none; }
        
        .product-info .actions-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .product-info .actions-row .btn {
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            justify-content: center;
            min-width: 180px;
            flex: 1;
        }
        
        .product-info .actions-row .btn-whatsapp { flex: 1.5; }
        
        .product-info .actions-row .btn-outline {
            flex: 0.6;
            min-width: auto;
            padding: 1rem;
        }
        
        .product-info .trust-badges {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .product-info .trust-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 0.5rem;
        }
        
        .product-info .trust-badge i {
            color: var(--gold);
            font-size: 1.1rem;
        }
        
        .related-section {
            margin-top: 4rem;
            padding-top: 3rem;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
        }
        
        .related-section h3 {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.25rem;
        }
        
        .related-card {
            background: rgba(26, 45, 74, 0.4);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.05);
            transition: var(--transition-fast);
            text-decoration: none;
            color: inherit;
        }
        
        .related-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: var(--shadow-glow);
        }
        
        .related-card .image {
            height: 150px;
            background: rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }
        
        .related-card .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .related-card .info { padding: 1rem; }
        
        .related-card .info h4 {
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }
        
        .related-card .info .price {
            color: var(--gold);
            font-weight: 700;
            font-size: 1.05rem;
            font-family: var(--font-heading);
        }
        
        .loading-state, .error-state {
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .error-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .error-state h2 { margin-bottom: 0.5rem; }
        
        .error-state p {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto 1.5rem;
        }
        
        .ceo-edit-bar {
            display: none;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(244, 196, 48, 0.08));
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
        }
        
        .ceo-edit-bar.visible { display: flex; }
        .ceo-edit-bar .icon { font-size: 1.5rem; }
        .ceo-edit-bar .text { flex: 1; color: var(--text-light); font-size: 0.95rem; }
        .ceo-edit-bar .btn { padding: 0.5rem 1rem; font-size: 0.85rem; }
        
        @media (max-width: 1024px) {
            .product-detail-layout { grid-template-columns: 1fr; gap: 2rem; }
            .product-gallery { position: static; }
            .product-gallery .main-image { height: 400px; }
        }
        
        @media (max-width: 768px) {
            .product-detail-page { padding-top: 80px; }
            .product-gallery .main-image { height: 300px; }
            .product-gallery .thumbnail { width: 60px; height: 60px; }
            .product-info .specs-table { grid-template-columns: 1fr; }
            .product-info .current-price { font-size: 1.5rem; }
            .product-info .actions-row { flex-direction: column; }
            .product-info .actions-row .btn { width: 100%; min-width: auto; }
            .product-info .actions-row .btn-outline { flex: 1; width: auto; }
            .related-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        }
        
        @media (max-width: 480px) {
            .product-gallery .main-image { height: 250px; }
            .related-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body id="main-content">
    <div id="header-placeholder"></div>
    
    <main class="product-detail-page">
        <div class="container">
            <div class="ceo-edit-bar" id="ceoEditBar">
                <span class="icon">👑</span>
                <div class="text">You're viewing as CEO — you can edit this product</div>
                <a href="admin/index.html" class="btn btn-primary">
                    <i class="fas fa-edit"></i> Edit in Dashboard
                </a>
            </div>
            
            <div id="productContent">
                <div class="loading-state">
                    <div class="loading"></div>
                    <p style="color: var(--text-muted); margin-top: 1rem;">Loading product details...</p>
                </div>
            </div>
        </div>
    </main>
    
    <div id="footer-placeholder"></div>
    
    <script>
        // ============================================
        // LOAD HEADER & FOOTER (correct paths for /src/pages/)
        // ============================================
        
        fetch('../components/header.html').then(r => r.text()).then(d => {
            document.getElementById('header-placeholder').innerHTML = d;
        }).catch(() => {});
        
        fetch('../components/footer.html').then(r => r.text()).then(d => {
            document.getElementById('footer-placeholder').innerHTML = d;
        }).catch(() => {});
        
        // ============================================
        // LOAD SCRIPTS
        // ============================================
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                if (document.querySelector(`script[src="${src}"]`)) return resolve();
                const s = document.createElement('script');
                s.src = src;
                s.async = false;
                s.onload = resolve;
                s.onerror = () => reject(new Error(`Could not load ${src}`));
                document.head.appendChild(s);
            });
        }
        
        let currentProduct = null;
        let currentQuantity = 1;
        let currentImageIndex = 0;
        let productImages = [];
        
        (async function init() {
            try {
                await loadScript('../../public/js/supabase.js');
                await loadScript('../../public/js/main.js');
                console.log('✅ Product detail scripts loaded');
                initProductDetail();
            } catch (err) {
                console.error('❌ Load error:', err);
            }
        })();
        
        async function initProductDetail() {
            console.log('📦 Initializing Product Detail...');
            
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');
            
            if (!productId) {
                showError('No product specified. Please select a product from our catalog.');
                return;
            }
            
            await loadProduct(productId);
            checkCeoStatus();
        }
        
        async function loadProduct(productId) {
            try {
                if (typeof getProductById === 'undefined') {
                    throw new Error('Product API not available');
                }
                
                const result = await getProductById(productId);
                
                if (result.success && result.product) {
                    currentProduct = result.product;
                    productImages = currentProduct.image_urls && currentProduct.image_urls.length > 0
                        ? currentProduct.image_urls
                        : ['https://via.placeholder.com/600x500/1A2D4A/FFD700?text=Genera+Tech'];
                    currentImageIndex = 0;
                    
                    // 🔥 TRACK PRODUCT VIEW (analytics + activity log)
                    if (typeof trackProductView === 'function') {
                        trackProductView(currentProduct.id, currentProduct.name).catch(err => {
                            console.warn('Product view tracking error:', err);
                        });
                    }
                    
                    renderProduct();
                    loadRelatedProducts(currentProduct.category);
                    
                    document.title = `${currentProduct.name} - Genera Tech Hub`;
                } else {
                    showError('Product not found. It may have been removed.');
                }
            } catch (error) {
                console.error('❌ Load error:', error);
                showError('Could not load product. Please try again.');
            }
        }
        
        function renderProduct() {
            const p = currentProduct;
            const container = document.getElementById('productContent');
            
            const price = new Intl.NumberFormat('en-NG', {
                style: 'currency',
                currency: 'NGN',
                minimumFractionDigits: 0
            }).format(p.price);
            
            const badges = [];
            if (p.is_featured) badges.push('<span class="badge badge-featured">⭐ Featured</span>');
            else if (p.condition === 'New') badges.push('<span class="badge badge-new">✨ New</span>');
            else if (p.condition === 'Refurbished') badges.push('<span class="badge badge-refurbished">🔄 Refurbished</span>');
            else if (p.condition === 'Used') badges.push('<span class="badge badge-used">📱 Used</span>');
            
            const inStock = p.stock_quantity > 0;
            const stockClass = inStock ? 'in-stock' : 'out-of-stock';
            const stockText = inStock 
                ? `In Stock — ${p.stock_quantity} available` 
                : 'Out of Stock';
            
            const specs = [
                { label: 'Brand', value: p.brand },
                { label: 'Model', value: p.model },
                { label: 'Condition', value: p.condition },
                { label: 'Storage', value: p.storage },
                { label: 'Color', value: p.color },
                { label: 'Category', value: p.category }
            ].filter(s => s.value);
            
            const specsHtml = specs.map(s => `
                <div class="spec-item">
                    <div class="spec-label">${s.label}</div>
                    <div class="spec-value">${s.value}</div>
                </div>
            `).join('');
            
            const thumbnailsHtml = productImages.length > 1 
                ? productImages.map((img, i) => `
                    <div class="thumbnail ${i === 0 ? 'active' : ''}" onclick="changeImage(${i})">
                        <img src="${img}" alt="View ${i + 1}"
                             onerror="this.src='https://via.placeholder.com/80x80/1A2D4A/FFD700?text=?'">
                    </div>
                `).join('')
                : '';
            
            const waMessage = encodeURIComponent(
                `Hi Genera Tech Hub! I'm interested in *${p.name}* - ${price}.\n\nQuantity: ${currentQuantity}\n\nPlease confirm availability and details.`
            );
            
            container.innerHTML = `
                <div class="product-detail-layout">
                    <div class="product-gallery">
                        <div class="main-image">
                            ${badges.length > 0 ? badges[0] : ''}
                            <img id="mainImage" src="${productImages[0]}" alt="${p.name}"
                                 onerror="this.src='https://via.placeholder.com/600x500/1A2D4A/FFD700?text=Genera+Tech'">
                        </div>
                        ${thumbnailsHtml ? `<div class="thumbnails">${thumbnailsHtml}</div>` : ''}
                    </div>
                    
                    <div class="product-info">
                        <div class="breadcrumb">
                            <a href="index.html">Home</a>
                            <span>›</span>
                            <a href="product.html">Products</a>
                            <span>›</span>
                            <span class="current">${p.name}</span>
                        </div>
                        
                        ${p.category ? `<span class="category-tag">${p.category}</span>` : ''}
                        
                        <h1>${p.name}</h1>
                        
                        <div class="rating-row">
                            <span class="stars">⭐⭐⭐⭐⭐</span>
                            <span class="rating-text">Trusted by hundreds of customers</span>
                        </div>
                        
                        <div class="price-section">
                            <div class="current-price">${price}</div>
                            <div class="price-note">Best price guaranteed</div>
                        </div>
                        
                        <div class="stock-row ${stockClass}">
                            <span class="stock-dot"></span>
                            <span>${stockText}</span>
                        </div>
                        
                        ${p.description ? `<div class="description">${p.description}</div>` : ''}
                        
                        ${specs.length > 0 ? `
                            <div class="specs-section">
                                <h3><i class="fas fa-list-ul"></i> Specifications</h3>
                                <div class="specs-table">
                                    ${specsHtml}
                                </div>
                            </div>
                        ` : ''}
                        
                        ${inStock ? `
                            <div class="quantity-row">
                                <label>Quantity:</label>
                                <div class="qty-control">
                                    <button onclick="updateQuantity(-1)">−</button>
                                    <input type="number" id="quantityInput" value="1" min="1" max="${p.stock_quantity}"
                                           onchange="updateQuantityFromInput(this)">
                                    <button onclick="updateQuantity(1)">+</button>
                                </div>
                            </div>
                        ` : ''}
                        
                        <div class="actions-row">
                            <a href="https://wa.me/2348081302228?text=${waMessage}" 
                               target="_blank" class="btn btn-whatsapp"
                               ${!inStock ? 'style="opacity: 0.5; pointer-events: none;"' : ''}>
                                <i class="fab fa-whatsapp"></i> ${inStock ? 'Buy on WhatsApp' : 'Out of Stock'}
                            </a>
                            <a href="product.html" class="btn btn-outline btn-secondary">
                                <i class="fas fa-arrow-left"></i>
                            </a>
                        </div>
                        
                        <div class="trust-badges">
                            <div class="trust-badge"><i class="fas fa-shield-alt"></i> 6-Month Warranty</div>
                            <div class="trust-badge"><i class="fas fa-check-circle"></i> 100% Genuine</div>
                            <div class="trust-badge"><i class="fas fa-truck"></i> Fast Delivery</div>
                            <div class="trust-badge"><i class="fas fa-headset"></i> 24/7 Support</div>
                        </div>
                    </div>
                </div>
                
                <div class="related-section" id="relatedSection">
                    <h3>🔄 You May Also Like</h3>
                    <div class="related-grid" id="relatedGrid">
                        <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">
                            Loading related products...
                        </p>
                    </div>
                </div>
            `;
            
            window.updateQuantity = updateQuantity;
            window.updateQuantityFromInput = updateQuantityFromInput;
            window.changeImage = changeImage;
        }
        
        function changeImage(index) {
            if (index < 0 || index >= productImages.length) return;
            currentImageIndex = index;
            
            const mainImg = document.getElementById('mainImage');
            if (mainImg) mainImg.src = productImages[index];
            
            document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
                thumb.classList.toggle('active', i === index);
            });
        }
        
        function updateQuantity(change) {
            const input = document.getElementById('quantityInput');
            if (!input) return;
            
            let newValue = parseInt(input.value) + change;
            const max = parseInt(input.max) || 999;
            
            if (newValue < 1) newValue = 1;
            if (newValue > max) newValue = max;
            
            input.value = newValue;
            currentQuantity = newValue;
            updateWhatsAppLink();
        }
        
        function updateQuantityFromInput(input) {
            let value = parseInt(input.value) || 1;
            const max = parseInt(input.max) || 999;
            
            if (value < 1) value = 1;
            if (value > max) value = max;
            
            input.value = value;
            currentQuantity = value;
            updateWhatsAppLink();
        }
        
        function updateWhatsAppLink() {
            if (!currentProduct) return;
            
            const price = new Intl.NumberFormat('en-NG', {
                style: 'currency', currency: 'NGN', minimumFractionDigits: 0
            }).format(currentProduct.price);
            
            const btn = document.querySelector('.actions-row .btn-whatsapp');
            if (btn) {
                const msg = encodeURIComponent(
                    `Hi Genera Tech Hub! I'm interested in *${currentProduct.name}* - ${price}.\n\nQuantity: ${currentQuantity}\n\nPlease confirm availability and details.`
                );
                btn.href = `https://wa.me/2348081302228?text=${msg}`;
            }
        }
        
        async function loadRelatedProducts(category) {
            try {
                if (typeof getProducts === 'undefined') return;
                
                const result = await getProducts({ category });
                const grid = document.getElementById('relatedGrid');
                
                if (!result.success || !result.products || result.products.length === 0) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No related products.</p>`;
                    return;
                }
                
                const related = result.products
                    .filter(p => p.id !== currentProduct?.id)
                    .slice(0, 4);
                
                if (related.length === 0) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No related products.</p>`;
                    return;
                }
                
                grid.innerHTML = related.map(p => {
                    const price = new Intl.NumberFormat('en-NG', {
                        style: 'currency', currency: 'NGN', minimumFractionDigits: 0
                    }).format(p.price);
                    
                    const img = p.image_urls && p.image_urls.length > 0
                        ? p.image_urls[0]
                        : 'https://via.placeholder.com/200x150/1A2D4A/FFD700?text=Genera+Tech';
                    
                    return `
                        <a href="product-detail.html?id=${p.id}" class="related-card">
                            <div class="image">
                                <img src="${img}" alt="${p.name}"
                                     onerror="this.src='https://via.placeholder.com/200x150/1A2D4A/FFD700?text=Genera+Tech'">
                            </div>
                            <div class="info">
                                <h4>${p.name}</h4>
                                <div class="price">${price}</div>
                            </div>
                        </a>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('❌ Related error:', error);
            }
        }
        
        async function checkCeoStatus() {
            try {
                if (typeof getCurrentUser === 'undefined') return;
                
                let tries = 0;
                while (!window.supabaseClient && tries < 20) {
                    await new Promise(r => setTimeout(r, 200));
                    tries++;
                }
                
                const result = await getCurrentUser();
                if (!result.success || !result.user) return;
                
                const isCeo = String(result.user.email || '').toLowerCase() === 'mudasirumukthar@gmail.com';
                
                if (isCeo) {
                    document.getElementById('ceoEditBar').classList.add('visible');
                }
            } catch (error) {
                console.warn('CEO check error:', error);
            }
        }
        
        function showError(message) {
            document.getElementById('productContent').innerHTML = `
                <div class="error-state">
                    <div class="icon">😕</div>
                    <h2>Product Not Found</h2>
                    <p>${message}</p>
                    <a href="product.html" class="btn btn-primary">
                        <i class="fas fa-arrow-left"></i> Browse All Products
                    </a>
                </div>
            `;
        }
        
        console.log('📦 Product detail ready');
    </script>
</body>
</html>
